<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hóa Đơn BMT</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d1117; --s1:#161b22; --s2:#1f2733; --s3:#252d38;
  --border:#30363d; --border2:#3d4752;
  --accent:#00b4d8; --green:#06d6a0; --warn:#f4a261; --danger:#e63946; --violet:#9b5de5;
  --txt:#e6edf3; --txt2:#8b949e; --txt3:#4d5663;
  --r:12px; --r2:8px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px;height:100%}
body{font-family:"Be Vietnam Pro",sans-serif;background:var(--bg);color:var(--txt);min-height:100%;min-height:100dvh;overflow-x:hidden}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;height:52px;
  background:var(--s1);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:200;
  box-shadow:0 2px 12px rgba(0,0,0,.5);
}
.brand{display:flex;align-items:center;gap:9px}
.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid rgba(0,180,216,.3)}
.brand-text{line-height:1.2}
.brand-text .t1{font-size:.78rem;font-weight:600;color:var(--txt2)}
.brand-text .t2{font-size:.92rem;font-weight:800;color:var(--accent);letter-spacing:.01em}
.topbar-btns{display:flex;gap:6px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
  border:none;border-radius:var(--r2);cursor:pointer;font-family:inherit;font-weight:700;
  transition:all .15s;white-space:nowrap;-webkit-user-select:none;user-select:none}
.btn:active{transform:scale(.93);opacity:.85}
.btn-sm{padding:7px 12px;font-size:.78rem}
.btn-md{padding:9px 16px;font-size:.85rem}
.btn-lg{padding:12px 20px;font-size:.92rem}
.btn-icon{padding:8px;border-radius:var(--r2)}
.btn-accent{background:var(--accent);color:#0d1117}
.btn-green{background:var(--green);color:#0d1117}
.btn-warn{background:var(--warn);color:#0d1117}
.btn-violet{background:var(--violet);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--s2);color:var(--txt2);border:1px solid var(--border)}
.btn-ghost:active{background:var(--s3)}
.btn-full{width:100%}

/* ── TABS ── */
.tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:190}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:.72rem;font-weight:700;
  color:var(--txt3);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;
  border-bottom:2px solid transparent;transition:all .15s;position:relative}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .tab-badge{
  position:absolute;top:6px;right:calc(50% - 22px);
  background:var(--accent);color:#0d1117;
  font-size:.6rem;font-weight:800;
  padding:1px 5px;border-radius:10px;min-width:16px;text-align:center;
}

/* ── PANELS ── */
.panel{display:none;padding:14px;padding-bottom:calc(80px + var(--safe-bottom));flex-direction:column;gap:12px}
.panel.active{display:flex}

/* ── CARDS ── */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card-title{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);padding-bottom:8px;border-bottom:1px solid var(--border)}

/* ── FORM FIELDS ── */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.75rem;font-weight:600;color:var(--txt2)}
.field input,.field select,.field textarea{
  background:var(--s2);border:1.5px solid var(--border);border-radius:var(--r2);
  color:var(--txt);font-family:inherit;font-size:.92rem;
  padding:10px 12px;outline:none;width:100%;
  transition:border-color .15s;
  -webkit-appearance:none;appearance:none;
}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field input[readonly]{color:var(--txt2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* ── AUTOCOMPLETE ── */
.ac-wrap{position:relative}
.ac-list{
  position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:400;
  background:var(--s2);border:1.5px solid var(--accent);border-radius:var(--r2);
  max-height:220px;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.6);display:none;
}
.ac-list.show{display:block}
.ac-item{
  padding:11px 12px;font-size:.88rem;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--border);transition:background .1s;
}
.ac-item:last-child{border-bottom:none}
.ac-item:active,.ac-item.hi{background:rgba(0,180,216,.12);color:var(--accent)}
.ac-price{font-size:.75rem;color:var(--txt3);font-family:"JetBrains Mono",monospace;white-space:nowrap}
.ac-item.hi .ac-price,.ac-item:active .ac-price{color:var(--accent)}

/* save hint */
.save-hint{
  display:none;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 11px;background:rgba(155,93,229,.1);
  border:1px solid rgba(155,93,229,.3);border-radius:var(--r2);
  font-size:.76rem;color:#c4a7f7;
}
.save-hint.show{display:flex}
.btn-save-new{padding:5px 11px;background:var(--violet);color:#fff;border:none;
  border-radius:6px;font-size:.75rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}

/* price row */
.price-row{display:flex;gap:7px}
.price-row input{flex:1}
.btn-edit-price{padding:10px 11px;background:rgba(244,162,97,.12);color:var(--warn);
  border:1.5px solid rgba(244,162,97,.3);border-radius:var(--r2);
  cursor:pointer;font-size:.8rem;font-weight:700;font-family:inherit;white-space:nowrap;flex-shrink:0}

/* ── GIA CÔNG GRID ── */
.gc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:14px 8px;border-radius:var(--r);
  background:var(--s2);border:1.5px solid var(--border);
  cursor:pointer;font-family:inherit;font-size:.76rem;font-weight:700;
  color:var(--txt2);transition:all .15s;
}
.gc-btn:active{transform:scale(.94)}
.gc-btn .gci{font-size:1.6rem;margin-bottom:2px}
.gc-btn.pcb:active,.gc-btn.pcb.sel{border-color:#06d6a0;color:#06d6a0;background:rgba(6,214,160,.08)}
.gc-btn.mica:active,.gc-btn.mica.sel{border-color:#9b5de5;color:#9b5de5;background:rgba(155,93,229,.08)}
.gc-btn.fomex:active,.gc-btn.fomex.sel{border-color:#f4a261;color:var(--warn);background:rgba(244,162,97,.08)}
.gc-btn.in3d:active,.gc-btn.in3d.sel{border-color:#e63946;color:var(--danger);background:rgba(230,57,70,.08)}

/* ── INVOICE LIST (panel 2) ── */
.inv-empty{text-align:center;padding:48px 20px;color:var(--txt3)}
.inv-empty .ei{font-size:3rem;margin-bottom:10px}

/* item row */
.item-row{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;background:var(--s2);border-radius:var(--r2);
  border:1px solid var(--border);
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.item-stt{width:22px;text-align:center;font-size:.75rem;color:var(--txt3);flex-shrink:0}
.item-body{flex:1;min-width:0}
.item-name{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{font-size:.75rem;color:var(--txt2);margin-top:2px}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.item-thanh{font-family:"JetBrains Mono",monospace;font-size:.85rem;font-weight:700;color:var(--green)}
.item-dg{font-size:.72rem;color:var(--txt3)}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:.65rem;font-weight:800;letter-spacing:.04em}
.b-lk{background:rgba(0,180,216,.15);color:var(--accent)}
.b-pcb{background:rgba(6,214,160,.15);color:#06d6a0}
.b-mica{background:rgba(155,93,229,.15);color:#9b5de5}
.b-fomex{background:rgba(244,162,97,.15);color:var(--warn)}
.b-in3d{background:rgba(230,57,70,.15);color:var(--danger)}
.item-del{background:none;border:none;color:var(--txt3);cursor:pointer;padding:6px;font-size:1rem;
  border-radius:6px;flex-shrink:0;transition:all .12s}
.item-del:active{background:rgba(230,57,70,.15);color:var(--danger)}

/* editable price in list */
.item-dg-tap{cursor:pointer;border-bottom:1px dashed var(--txt3)}

/* ── SAVED HĐ LIST ── */
.hd-card{
  display:flex;align-items:center;gap:10px;
  padding:12px;background:var(--s2);border-radius:var(--r);
  border:1px solid var(--border);cursor:pointer;transition:all .15s;
}
.hd-card:active{border-color:var(--accent);background:rgba(0,180,216,.06)}
.hd-card-id{font-family:"JetBrains Mono",monospace;font-size:.7rem;color:var(--accent);
  background:rgba(0,180,216,.1);padding:3px 7px;border-radius:5px;white-space:nowrap}
.hd-card-body{flex:1;min-width:0}
.hd-card-main{font-weight:700;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-card-sub{font-size:.72rem;color:var(--txt2);margin-top:2px}
.hd-card-tien{font-family:"JetBrains Mono",monospace;font-size:.8rem;color:var(--green);white-space:nowrap}
.hd-card-del{background:none;border:none;color:var(--txt3);cursor:pointer;padding:7px;font-size:.9rem;border-radius:6px}
.hd-card-del:active{background:rgba(230,57,70,.15);color:var(--danger)}

/* ── BOTTOM BAR ── */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:var(--s1);border-top:1px solid var(--border);
  padding:10px 14px;padding-bottom:calc(10px + var(--safe-bottom));
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  box-shadow:0 -4px 20px rgba(0,0,0,.4);
}
.tong-tien{display:flex;flex-direction:column}
.tong-label{font-size:.65rem;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tong-val{font-family:"JetBrains Mono",monospace;font-size:1.1rem;font-weight:800;color:var(--green)}
.bottom-actions{display:flex;gap:7px}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;
  padding:0;
}
.modal-overlay.show{display:flex}
.modal{
  background:var(--s1);border:1px solid var(--border);
  border-radius:20px 20px 0 0;
  padding:20px 16px;padding-bottom:calc(20px + var(--safe-bottom));
  width:100%;max-width:540px;
  box-shadow:0 -8px 40px rgba(0,0,0,.6);
  animation:slideUp .25s ease;
  max-height:92dvh;overflow-y:auto;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:1rem;font-weight:800;margin-bottom:16px}
.modal-sub{font-size:.78rem;color:var(--txt2);font-weight:400;margin-top:2px}
.modal-fields{display:flex;flex-direction:column;gap:11px;margin-bottom:16px}
.modal-actions{display:flex;gap:8px}
.preview-box{
  background:rgba(6,214,160,.08);border:1px solid rgba(6,214,160,.25);
  border-radius:var(--r2);padding:12px;
  font-family:"JetBrains Mono",monospace;font-size:1.1rem;font-weight:700;
  color:var(--green);text-align:center;margin-bottom:14px;
}

/* ── HEADER INFO in panel 2 ── */
.hd-info-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 12px;background:var(--s2);border-radius:var(--r);
  border:1px solid var(--border);
}
.badge-id{background:rgba(0,180,216,.12);color:var(--accent);border:1px solid rgba(0,180,216,.25);
  padding:3px 10px;border-radius:20px;font-size:.72rem;font-family:"JetBrains Mono",monospace;font-weight:700}
.hd-meta-txt{font-size:.8rem;color:var(--txt2);flex:1}
.hd-meta-txt strong{color:var(--txt)}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ── TOAST ── */
.toast-wrap{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:9999;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90%;max-width:360px}
.toast{padding:10px 16px;border-radius:var(--r);font-size:.83rem;font-weight:700;
  box-shadow:0 4px 20px rgba(0,0,0,.5);animation:toastIn .22s ease;text-align:center;width:100%}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:none}}
.toast-success{background:var(--green);color:#0d1117}
.toast-error{background:var(--danger);color:#fff}
.toast-info{background:var(--accent);color:#0d1117}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--border);margin:2px 0}

/* ── DESKTOP adjustments ── */
@media(min-width:640px){
  .modal-overlay{align-items:center}
  .modal{border-radius:16px;max-height:88vh;max-width:480px;margin:20px}
  .panel{max-width:600px;margin:0 auto;width:100%}
  body{background:#0a0e14}
  .tabs,.topbar,.bottom-bar{max-width:600px;margin:0 auto}
  .tabs,.topbar{border-radius:0}
}
</style>
</head>

function loadBG(){try{const e=JSON.parse(localStorage.getItem('bmt_bg')||'{}');return Object.assign({},DEFAULT_BANG_GIA,e);}catch{return{...DEFAULT_BANG_GIA};}}
function saveBG(bg){const c={};for(const k in bg)if(!(k in DEFAULT_BANG_GIA))c[k]=bg[k];localStorage.setItem('bmt_bg',JSON.stringify(c));}
function getDVList(){try{const e=JSON.parse(localStorage.getItem('bmt_dv')||'[]');return[...DEFAULT_DON_VI,...e.filter(x=>!DEFAULT_DON_VI.includes(x))];}catch{return[...DEFAULT_DON_VI];}}
function saveDV(n){try{const e=JSON.parse(localStorage.getItem('bmt_dv')||'[]');if(!e.includes(n)){e.push(n);localStorage.setItem('bmt_dv',JSON.stringify(e));}}catch{}}

let BG = loadBG();
let state = {id:genId(), items:[], suaIdx:-1, gcType:null};

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('txtNgayXuat').value = today();
  updateHeader(); renderItems(); setupAC(); setupDVAC();
  document.getElementById('txtSoLuong').addEventListener('keydown',e=>{if(e.key==='Enter')themLinhKien();});
  document.getElementById('inputSuaGia').addEventListener('keydown',e=>{if(e.key==='Enter')confirmSuaGia();});
  document.querySelectorAll('.modal-overlay').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('show');}));

// ══════════════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════════════
function switchTab(n){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('active',i===n));
}

// ══════════════════════════════════════════════════════
// HEADER
// ══════════════════════════════════════════════════════
function genId(){return Math.random().toString(36).substr(2,8).toUpperCase();}
function today(){return new Date().toISOString().split('T')[0];}
function fmt(n){return new Intl.NumberFormat('vi-VN').format(Math.round(n))+' vnđ';}
function fmtN(n){return new Intl.NumberFormat('vi-VN').format(Math.round(n));}
function fmtDate(s){if(!s)return'';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y;}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function updateHeader(){
  document.getElementById('badgeId').textContent=state.id;
  const dv=document.getElementById('txtDonVi').value.trim();
  const da=document.getElementById('txtDuAn').value.trim();
  const ng=document.getElementById('txtNgayXuat').value;
  let t='';
  if(dv)t+=`<strong>${escH(dv)}</strong>`;
  if(da)t+=(t?' — ':'')+escH(da);
  if(ng)t+=(t?' — ':'')+fmtDate(ng);
  document.getElementById('hdInfoText').innerHTML=t||'Chưa có thông tin';
}

// ══════════════════════════════════════════════════════
// RENDER ITEMS
// ══════════════════════════════════════════════════════
function calcT(it){
  if(it.loai==='lk')return(it.sl||0)*(it.dg||0);
  if(it.loai==='in3d')return(it.gio||0)*(it.dg||0);
  return(it.r||0)*(it.c||0)*(it.dg||0);
}
const BADGE={lk:'b-lk',pcb:'b-pcb',mica:'b-mica',fomex:'b-fomex',in3d:'b-in3d'};
const BTXT={lk:'Linh kiện',pcb:'PCB',mica:'Mica',fomex:'Fomex',in3d:'In 3D'};

function renderItems(){
  const el=document.getElementById('itemList');
  const cnt=state.items.length;
  // badge
  const badge=document.getElementById('itemBadge');
  badge.textContent=cnt;badge.style.display=cnt?'':'none';
  // total
  const total=state.items.reduce((s,it)=>s+calcT(it),0);
  document.getElementById('lblTong').textContent=fmt(total);
  if(!cnt){
    el.innerHTML=`<div class="inv-empty"><div class="ei">📄</div><p style="color:var(--txt3)">Chưa có mặt hàng nào.<br><span style="font-size:.8rem">Chuyển sang tab Nhập liệu để thêm.</span></p></div>`;
    return;
  }
  el.innerHTML=state.items.map((it,i)=>{
    const ts=it.loai==='lk'?`× ${it.sl}`:it.loai==='in3d'?`${it.gio} giờ`:`${it.r} × ${it.c} cm²`;
    return`<div class="item-row">
      <span class="item-stt">${i+1}</span>
      <div class="item-body">
        <div class="item-name">${escH(it.ten)} <span class="badge ${BADGE[it.loai]||'b-lk'}">${BTXT[it.loai]||'?'}</span></div>
        <div class="item-meta">${ts}</div>
      </div>
      <div class="item-right">
        <span class="item-thanh">${fmt(calcT(it))}</span>
        <span class="item-dg item-dg-tap" onclick="openSuaGia(${i})" title="Sửa giá">${fmtN(it.dg)} vnđ</span>
      </div>
      <button class="item-del" onclick="delItem(${i})">✕</button>
    </div>`;
  }).join('');
}

function delItem(i){state.items.splice(i,1);renderItems();}

// ══════════════════════════════════════════════════════
// SỬA GIÁ
// ══════════════════════════════════════════════════════
function openSuaGia(i){
  state.suaIdx=i;
  document.getElementById('suaGiaSub').textContent=state.items[i].ten;
  document.getElementById('inputSuaGia').value=state.items[i].dg;
  document.getElementById('modalSuaGia').classList.add('show');
  setTimeout(()=>document.getElementById('inputSuaGia').select(),80);
}
function confirmSuaGia(){
  const v=parseFloat(document.getElementById('inputSuaGia').value);
  if(isNaN(v)||v<0){toast('error','Đơn giá không hợp lệ');return;}
  state.items[state.suaIdx].dg=v;
  renderItems();closeModal('modalSuaGia');toast('success','Đã cập nhật giá');
}

// ══════════════════════════════════════════════════════
// AUTOCOMPLETE LINH KIỆN
// ══════════════════════════════════════════════════════
let priceManual=false;
function toggleEditPrice(){
  priceManual=true;
  const inp=document.getElementById('txtDonGia');
  inp.value=inp.value.replace(/[^\d]/g,'');
  inp.readOnly=false;inp.style.borderColor='var(--warn)';inp.focus();
}

function setupAC(){
  const inp=document.getElementById('txtTenHang');
  const list=document.getElementById('acList');
  let hi=-1;
  inp.addEventListener('input',()=>{
    priceManual=false;
    const dgi=document.getElementById('txtDonGia');
    dgi.readOnly=true;dgi.style.borderColor='';dgi.value='';
    document.getElementById('saveHint').classList.remove('show');
    const q=inp.value.trim().toLowerCase();
    if(!q){list.classList.remove('show');return;}
    const ms=Object.keys(BG).filter(k=>k.toLowerCase().includes(q)).sort();
    if(!ms.length){
      list.classList.remove('show');
      document.getElementById('saveHint').classList.add('show');
      return;
    }
    list.innerHTML=ms.map((m,i)=>`<div class="ac-item" data-idx="${i}" data-val="${escH(m)}">
      <span>${escH(m)}</span><span class="ac-price">${fmtN(BG[m])}</span>
    </div>`).join('');
    list.classList.add('show');hi=-1;
    list.querySelectorAll('.ac-item').forEach(el=>el.addEventListener('click',()=>selAC(el.dataset.val)));
  });
  inp.addEventListener('keydown',e=>{
    const items=list.querySelectorAll('.ac-item');
    if(!list.classList.contains('show')){if(e.key==='Enter')themLinhKien();return;}
    if(e.key==='ArrowDown'){hi=Math.min(hi+1,items.length-1);hiAC(items,hi);e.preventDefault();}
    else if(e.key==='ArrowUp'){hi=Math.max(hi-1,0);hiAC(items,hi);e.preventDefault();}
    else if(e.key==='Enter'&&hi>=0){selAC(items[hi].dataset.val);e.preventDefault();}
    else if(e.key==='Escape')list.classList.remove('show');
  });
}
function hiAC(items,idx){items.forEach((el,i)=>el.classList.toggle('hi',i===idx));if(items[idx])items[idx].scrollIntoView({block:'nearest'});}
function selAC(val){
  document.getElementById('txtTenHang').value=val;
  document.getElementById('acList').classList.remove('show');
  document.getElementById('saveHint').classList.remove('show');
  const key=Object.keys(BG).find(k=>k.toLowerCase()===val.toLowerCase());
  const dgi=document.getElementById('txtDonGia');
  dgi.value=key?fmt(BG[key]):'';dgi.readOnly=true;dgi.style.borderColor='';
  priceManual=false;
  document.getElementById('txtSoLuong').focus();
}
function saveNewItem(){
  const ten=document.getElementById('txtTenHang').value.trim();
  if(!ten){toast('error','Nhập tên trước');return;}
  const raw=document.getElementById('txtDonGia').value.replace(/[^\d]/g,'');
  const dg=parseInt(raw)||0;
  if(!dg){
    const dgi=document.getElementById('txtDonGia');
    dgi.value='';dgi.readOnly=false;dgi.style.borderColor='var(--warn)';dgi.focus();
    priceManual=true;toast('info','Nhập đơn giá rồi nhấn Lưu & dùng');return;
  }
  BG[ten]=dg;saveBG(BG);
  document.getElementById('saveHint').classList.remove('show');
  document.getElementById('txtDonGia').value=fmt(dg);
  document.getElementById('txtDonGia').readOnly=true;
  document.getElementById('txtDonGia').style.borderColor='';
  toast('success',`Đã lưu "${ten}"`);
  document.getElementById('txtSoLuong').focus();
}

// ══════════════════════════════════════════════════════
// AUTOCOMPLETE ĐƠN VỊ
// ══════════════════════════════════════════════════════
function setupDVAC(){
  const inp=document.getElementById('txtDonVi');
  inp.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('acDonViList').classList.remove('show');});
}
function filterDonVi(){
  const inp=document.getElementById('txtDonVi');
  const list=document.getElementById('acDonViList');
  const hint=document.getElementById('saveHintDonVi');
  const q=inp.value.trim().toLowerCase();
  const all=getDVList();
  const ms=q?all.filter(x=>x.toLowerCase().includes(q)):all;
  hint.classList.remove('show');
  if(!ms.length){list.classList.remove('show');if(q&&!all.find(x=>x.toLowerCase()===q))hint.classList.add('show');return;}
  list.innerHTML=ms.map(m=>`<div class="ac-item" onclick="selDV(this.dataset.val)" data-val="${escH(m)}"><span>${escH(m)}</span></div>`).join('');
  list.classList.add('show');
  if(q&&!all.find(x=>x.toLowerCase()===q))hint.classList.add('show');
}
function selDV(val){
  document.getElementById('txtDonVi').value=val;
  document.getElementById('acDonViList').classList.remove('show');
  document.getElementById('saveHintDonVi').classList.remove('show');
  updateHeader();
}
function saveNewDonVi(){
  const v=document.getElementById('txtDonVi').value.trim();
  if(!v)return;
  saveDV(v);
  document.getElementById('saveHintDonVi').classList.remove('show');
  document.getElementById('acDonViList').classList.remove('show');
  toast('success',`Đã lưu "${v}"`);
}

// ══════════════════════════════════════════════════════
// THÊM LINH KIỆN
// ══════════════════════════════════════════════════════
function themLinhKien(){
  const ten=document.getElementById('txtTenHang').value.trim();
  const sl=parseInt(document.getElementById('txtSoLuong').value)||0;
  const dgRaw=document.getElementById('txtDonGia').value.replace(/[^\d]/g,'');
  let dg=parseInt(dgRaw)||0;
  if(!dg){const k=Object.keys(BG).find(x=>x.toLowerCase()===ten.toLowerCase());if(k)dg=BG[k];}
  if(!ten){toast('error','Nhập tên linh kiện');return;}
  if(sl<=0){toast('error','Số lượng không hợp lệ');return;}
  if(!dg){toast('error','Nhập đơn giá');return;}
  state.items.push({loai:'lk',ten,sl,dg});
  renderItems();
  document.getElementById('txtTenHang').value='';
  document.getElementById('txtSoLuong').value='1';
  document.getElementById('txtDonGia').value='';
  document.getElementById('txtDonGia').readOnly=true;
  document.getElementById('txtDonGia').style.borderColor='';
  document.getElementById('acList').classList.remove('show');
  document.getElementById('saveHint').classList.remove('show');
  priceManual=false;
  toast('success',`Đã thêm: ${ten} × ${sl}`);
  // auto switch to invoice tab to show result
  switchTab(1);setTimeout(()=>switchTab(0),800);
  document.getElementById('txtTenHang').focus();
}

// ══════════════════════════════════════════════════════
// GIA CÔNG
// ══════════════════════════════════════════════════════
function openGiaCong(type){
  state.gcType=type;
  const cfg=GC_CFG[type];
  document.getElementById('gcTitle').innerHTML=cfg.icon+' '+cfg.label;
  let html='';
  if(cfg.area){
    html=`<div class="row2">
      <div class="field"><label>Chiều rộng (cm)</label><input id="gcP1" type="number" min="0.1" step="0.1" placeholder="0.0" inputmode="decimal" oninput="updGCPrev()"></div>
      <div class="field"><label>Chiều cao (cm)</label><input id="gcP2" type="number" min="0.1" step="0.1" placeholder="0.0" inputmode="decimal" oninput="updGCPrev()"></div>
    </div>
    <div class="field"><label>Đơn giá (vnđ/cm²)</label><input id="gcDG" type="number" value="${cfg.dg}" inputmode="numeric" oninput="updGCPrev()"></div>`;
  } else {
    html=`<div class="field"><label>Số giờ in</label><input id="gcP1" type="number" min="0.1" step="0.1" placeholder="0.0" inputmode="decimal" oninput="updGCPrev()"></div>
    <div class="field"><label>Đơn giá (vnđ/giờ)</label><input id="gcDG" type="number" value="${cfg.dg}" inputmode="numeric" oninput="updGCPrev()"></div>`;
  }
  document.getElementById('gcFields').innerHTML=html;
  document.getElementById('gcPreview').textContent='Thành tiền: 0 vnđ';
  document.getElementById('modalGC').classList.add('show');
  setTimeout(()=>document.getElementById('gcP1').focus(),120);
}
function updGCPrev(){
  const cfg=GC_CFG[state.gcType];
  const dg=parseFloat(document.getElementById('gcDG').value)||0;
  const p1=parseFloat(document.getElementById('gcP1').value)||0;
  let t=0;
  if(cfg.area){const p2=parseFloat(document.getElementById('gcP2')?.value)||0;t=p1*p2*dg;}
  else t=p1*dg;
  document.getElementById('gcPreview').textContent='Thành tiền: '+fmt(t);
}
function confirmGC(){
  const cfg=GC_CFG[state.gcType];
  const dg=parseFloat(document.getElementById('gcDG').value);
  const p1=parseFloat(document.getElementById('gcP1').value);
  if(!dg||dg<=0){toast('error','Đơn giá không hợp lệ');return;}
  if(!p1||p1<=0){toast('error',cfg.area?'Chiều rộng không hợp lệ':'Số giờ không hợp lệ');return;}
  if(cfg.area){
    const p2=parseFloat(document.getElementById('gcP2').value);
    if(!p2||p2<=0){toast('error','Chiều cao không hợp lệ');return;}
    state.items.push({loai:state.gcType,ten:cfg.label,r:p1,c:p2,dg});
  } else {
    state.items.push({loai:'in3d',ten:cfg.label,gio:p1,dg});
  }
  renderItems();closeModal('modalGC');
  toast('success','Đã thêm: '+cfg.label);
}

function getAll(){try{return JSON.parse(localStorage.getItem('bmt_hd')||'[]');}catch{return[];}}
function setAll(l){localStorage.setItem('bmt_hd',JSON.stringify(l));}

function luuHoaDon(){
  if(!state.items.length){toast('error','Không có dữ liệu để lưu');return;}
  const hd={id:state.id,donVi:document.getElementById('txtDonVi').value.trim(),
    duAn:document.getElementById('txtDuAn').value.trim(),
    ngay:document.getElementById('txtNgayXuat').value,
    items:JSON.parse(JSON.stringify(state.items)),ts:new Date().toISOString()};
  const list=getAll();const idx=list.findIndex(x=>x.id===hd.id);
  if(idx>=0)list[idx]=hd;else list.unshift(hd);
  setAll(list);toast('success',`Đã lưu [${hd.id}]`);
}
function newHoaDon(){
  if(state.items.length&&!confirm('Tạo HĐ mới? Dữ liệu hiện tại sẽ mất.'))return;
  state.id=genId();state.items=[];
  document.getElementById('txtDonVi').value='';
  document.getElementById('txtDuAn').value='';
  document.getElementById('txtNgayXuat').value=today();
  updateHeader();renderItems();toast('info','Hóa đơn mới');
}
function openDanhSach(){
  const list=getAll();
  const el=document.getElementById('dsList');
  if(!list.length){el.innerHTML=`<div style="text-align:center;padding:32px;color:var(--txt3)">Chưa có hóa đơn nào</div>`;
  } else {
    el.innerHTML=list.map(hd=>{
      const tot=hd.items.reduce((s,it)=>s+calcT(it),0);
      return`<div class="hd-card" onclick="moHD('${hd.id}')">
        <span class="hd-card-id">${hd.id}</span>
        <div class="hd-card-body">
          <div class="hd-card-main">${escH(hd.donVi||'(Chưa có đơn vị)')}</div>
          <div class="hd-card-sub">${escH(hd.duAn||'—')} · ${fmtDate(hd.ngay)} · ${hd.items.length} mục</div>
        </div>
        <span class="hd-card-tien">${fmt(tot)}</span>
        <button class="hd-card-del" onclick="delHD('${hd.id}',event)">🗑</button>
      </div>`;
    }).join('');
  }
  document.getElementById('modalDS').classList.add('show');
}
function moHD(id){
  const hd=getAll().find(x=>x.id===id);if(!hd)return;
  state.id=hd.id;state.items=JSON.parse(JSON.stringify(hd.items));
  document.getElementById('txtDonVi').value=hd.donVi||'';
  document.getElementById('txtDuAn').value=hd.duAn||'';
  document.getElementById('txtNgayXuat').value=hd.ngay||today();
  updateHeader();renderItems();closeModal('modalDS');toast('info',`Đã mở [${hd.id}]`);
}
function delHD(id,e){
  e.stopPropagation();if(!confirm(`Xóa HĐ [${id}]?`))return;
  setAll(getAll().filter(x=>x.id!==id));openDanhSach();toast('success','Đã xóa');
}

async function xuatExcel(){
  if(!state.items.length){toast('error','Không có dữ liệu');return;}
  if(typeof XLSX==='undefined')await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const dv=document.getElementById('txtDonVi').value.trim();
  const da=document.getElementById('txtDuAn').value.trim();
  const ng=document.getElementById('txtNgayXuat').value;
  const rows=[['Đơn vị:',dv],['Dự án:',da],['Ngày:',fmtDate(ng)],[],
    ['STT','Tên hàng','SL / Tham số','Đơn giá','Thành tiền']];
  let stt=1;
  state.items.forEach(it=>{
    const ts=it.loai==='lk'?it.sl:it.loai==='in3d'?it.gio+' giờ':it.r+'×'+it.c+' cm²';
    rows.push([stt++,it.ten,ts,it.dg,calcT(it)]);
  });
  rows.push([],['','','','Tổng:',state.items.reduce((s,it)=>s+calcT(it),0)]);
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:6},{wch:36},{wch:16},{wch:14},{wch:16}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'HoaDon');
  XLSX.writeFile(wb,`HoaDon_${(dv||'BMT').replace(/\s+/g,'_')}_${ng||'unknown'}.xlsx`);
  toast('success','Xuất Excel xong!');
}

  const html=`<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>HĐ ${state.id}</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Be Vietnam Pro',Arial,sans-serif;background:#fff;color:#1a1a2e;padding:28px 36px;font-size:12.5px}
  .hdr{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0077b6;padding-bottom:16px;margin-bottom:18px}
  .hdr-l{display:flex;align-items:center;gap:14px}.co-name{font-size:21px;font-weight:800;color:#0d2a5e}.co-name span{color:#0077b6}
  .co-sub{font-size:10.5px;color:#555;margin-top:2px}.co-addr{font-size:10px;color:#777;margin-top:2px}
  .hdr-r{text-align:right}.doc-title{font-size:17px;font-weight:800;color:#0d2a5e;text-transform:uppercase}
  .doc-id{font-family:monospace;font-size:10px;color:#0077b6;background:#e8f4fd;padding:3px 8px;border-radius:4px;display:inline-block;margin-top:4px}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .info-box{background:#f7faff;border:1px solid #d0e8ff;border-radius:7px;padding:10px 14px}
  .info-box label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#0077b6;display:block;margin-bottom:3px}
  .info-box .val{font-size:13px;font-weight:700;color:#0d2a5e}
  table{width:100%;border-collapse:collapse;margin-bottom:14px}
  thead th{background:#0d2a5e;color:#fff;padding:9px;font-size:10px;text-transform:uppercase;font-weight:700}
  thead th:first-child{border-radius:5px 0 0 0}thead th:last-child{border-radius:0 5px 0 0}
  tbody tr:nth-child(even){background:#f5f9ff}tbody td{padding:8px 9px;border-bottom:1px solid #e8eef8}
  .tong td{background:#0d2a5e!important;color:#fff;font-weight:800;font-size:13px;padding:11px 9px}
  .tong td:last-child{color:#7af0c5;font-family:monospace;font-size:15px}
  .footer{margin-top:18px;border-top:1px solid #ddd;padding-top:14px;display:flex;justify-content:space-between;align-items:flex-end}
  .note{font-size:10px;color:#666;line-height:1.8}
  .signs{display:flex;gap:36px}.sign-box{text-align:center}
  .sign-title{font-weight:700;font-size:11px;color:#0d2a5e}.sign-line{border-top:1px solid #ccc;width:150px;margin:44px auto 5px}.sign-name{font-size:10px;color:#777}
  @media print{body{padding:16px 24px}@page{margin:8mm;size:A4}}</style></head><body>
  <div class="hdr">
    <div class="hdr-l"><img src="${logoSrc}" style="width:68px;height:68px;object-fit:contain">
      <div><div class="co-name"><span>BMT</span> Team</div>
      <div class="co-sub">Giải pháp công nghệ và Linh kiện điện tử</div>
      <div class="co-addr">📧 bmtteam2025@gmail.com &nbsp;|&nbsp; 📞 0764 811 403</div></div></div>
    <div class="hdr-r"><div class="doc-title">Báo giá linh kiện</div>
      <div class="doc-id">Mã HĐ: ${state.id}</div>
      <div style="font-size:10px;color:#888;margin-top:5px">In: ${new Date().toLocaleString('vi-VN')}</div></div>
  </div>
  <div class="info-grid">
    <div class="info-box"><label>Đơn vị mua hàng</label><div class="val">${escH(dv)}</div></div>
    <div class="info-box"><label>Dự án</label><div class="val">${escH(da)}</div></div>
    <div class="info-box"><label>Ngày xuất</label><div class="val">${ng}</div></div>
    <div class="info-box"><label>Số mục</label><div class="val">${state.items.length} mặt hàng</div></div>
  </div>
  <table><thead><tr>
    <th style="width:36px;text-align:center">STT</th><th style="text-align:left">Tên hàng</th>
    <th style="width:68px;text-align:center">Loại</th><th style="width:110px;text-align:center">SL/Tham số</th>
    <th style="width:110px;text-align:right">Đơn giá</th><th style="width:120px;text-align:right">Thành tiền</th>
  </tr></thead><tbody>${rows}
    <tr class="tong"><td colspan="5" style="text-align:right;padding-right:12px">TỔNG TIỀN (VNĐ):</td><td style="text-align:right">${fmtN(total)}</td></tr>
  </tbody></table>
  <div class="footer">
    <div class="note"><strong style="color:#0d2a5e">Ghi chú:</strong><br>Báo giá có giá trị 30 ngày.<br>Liên hệ BMT Team để được hỗ trợ.</div>
    <div class="signs">
      <div class="sign-box"><div class="sign-title">Người lập</div><div class="sign-line"></div><div class="sign-name">(Ký tên)</div></div>
      <div class="sign-box"><div class="sign-title">Người duyệt</div><div class="sign-line"></div><div class="sign-name">(Ký tên)</div></div>
    </div>
  </div>
  <script>window.onload=()=>window.print();<\/script></body></html>`;

// HELPERS

function closeModal(id){document.getElementById(id).classList.remove('show');}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function toast(type,msg){
  const c=document.getElementById('toastWrap');
  const el=document.createElement('div');
  el.className=`toast toast-${type}`;el.textContent=msg;c.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(-8px) scale(.95)';el.style.transition='all .3s';setTimeout(()=>el.remove(),300);},2400);
}
</script>
</body>
